<svg width="1280" height="460" viewBox="0 0 1280 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Andre Deomondes — Backend &amp; Applied AI Engineer</title>
  <desc id="desc">Capa grafite com luz de sódio: logo de terminal, nome, cargo e um mapa de sistema animado com requisições passando entre web, api, postgres, redis, agente e llm.</desc>
  <defs>
    <radialGradient id="sodium" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(934 230) rotate(90) scale(300 420)">
      <stop stop-color="#FFD43B" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FFD43B" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .rail { stroke: #FFFFFF; stroke-opacity: 0.07; }
      .plus { fill: #FFFFFF; fill-opacity: 0.3; font: 400 14px Consolas, 'JetBrains Mono', monospace; }
      .mono { font-family: Consolas, 'JetBrains Mono', 'SF Mono', monospace; font-weight: 500; }
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; }
      .link { stroke: #FFFFFF; stroke-opacity: 0.14; stroke-dasharray: 3 4; }
      .flow { stroke: #FFD43B; stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 0.16 1; stroke-dashoffset: 1.16; filter: url(#glow); animation: flow 2.75s cubic-bezier(.55,0,.45,1) infinite; }
      .node rect { fill: #121316; stroke: #FFFFFF; stroke-opacity: 0.14; }
      .pulse { animation: blink 2.75s ease-in-out infinite; }
      .d1 { animation-delay: .3s; } .d2 { animation-delay: .9s; } .d3 { animation-delay: 1.4s; } .d4 { animation-delay: 1.9s; } .d5 { animation-delay: 2.4s; }
      .cursor { animation: cursor 1.1s steps(1) infinite; }
      @keyframes flow { to { stroke-dashoffset: 0; } }
      @keyframes blink { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
      @keyframes cursor { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .flow, .pulse, .cursor { animation: none; } .flow { display: none; } }
    </style>
  </defs>

