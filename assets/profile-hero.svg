<svg width="1280" height="460" viewBox="0 0 1280 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Andre Deomondes — Backend &amp; Applied AI Engineer</title>
  <desc id="desc">Capa grafite com luz de sódio: logo de terminal, nome, cargo e um mapa de sistema animado com requisições passando entre web, api, postgres, redis, agente e llm.</desc>

  <defs>
    <radialGradient id="sodium" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 230) rotate(90) scale(300 420)">
      <stop stop-color="#FFD43B" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFD43B" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .rail { stroke: #FFFFFF; stroke-opacity: 0.07; }
      .plus { fill: #FFFFFF; fill-opacity: 0.3; font: 400 14px Consolas, 'JetBrains Mono', monospace; }
      .mono { font-family: Consolas, 'JetBrains Mono', 'SF Mono', monospace; }
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .link { stroke: #FFFFFF; stroke-opacity: 0.14; stroke-dasharray: 3 4; }
      .flow { stroke: #FFD43B; stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 0.16 1; stroke-dashoffset: 1.16; filter: url(#glow); animation: flow 2.75s cubic-bezier(.55,0,.45,1) infinite; }
      .node rect { fill: #121316; stroke: #FFFFFF; stroke-opacity: 0.14; }
      .node text { fill: #D6D6DA; font: 500 14px Consolas, 'JetBrains Mono', monospace; }
      .dot { fill: #FFD43B; animation: blink 2.75s ease-in-out infinite; }
      .cursor { animation: cursor 1.1s steps(1) infinite; }
      @keyframes flow { to { stroke-dashoffset: 0; } }
      @keyframes blink { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes cursor { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .flow, .dot, .cursor { animation: none; } .flow { display: none; } }
    </style>
  </defs>

  <rect width="1280" height="460" rx="24" fill="#060708"/>
  <rect width="1280" height="460" rx="24" fill="url(#sodium)"/>

  <!-- blueprint rails -->
  <path class="rail" d="M56 0V460M1224 0V460M0 64H1280M0 396H1280"/>
  <text class="plus" x="50" y="69">+</text>
  <text class="plus" x="1218" y="69">+</text>
  <text class="plus" x="50" y="401">+</text>
  <text class="plus" x="1218" y="401">+</text>

  <!-- brand -->
  <g transform="translate(88 20)">
    <rect x="0.75" y="0.75" width="24.5" height="24.5" rx="7.5" fill="#111214" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="1.5"/>
    <path d="M7.5 9l4.2 4-4.2 4" stroke="#F4F4F1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="cursor" x="13.5" y="15.4" width="6" height="2.2" rx="1.1" fill="#FFD43B"/>
    <text class="sans" x="36" y="18" fill="#F4F4F1" font-size="15" font-weight="700" letter-spacing="-0.3">andre<tspan fill="#9C9CA3" font-weight="500">deomondes</tspan></text>
  </g>
  <text class="mono" x="1192" y="38" fill="#9C9CA3" font-size="13" text-anchor="end">andredeomondes.dev</text>

  <!-- headline -->
  <text class="sans" x="88" y="172" fill="#F4F4F1" font-size="66" font-weight="700" letter-spacing="-2.6">Andre Deomondes.</text>
  <text class="sans" x="88" y="222" fill="#9C9CA3" font-size="30" font-weight="500" letter-spacing="-0.8">Backend &amp; Applied AI Engineer</text>
  <text class="sans" x="88" y="266" fill="#9C9CA3" font-size="17">APIs, dados e agentes de IA que aguentam tráfego,</text>
  <text class="sans" x="88" y="292" fill="#9C9CA3" font-size="17">dinheiro de verdade e mudança.</text>

  <g transform="translate(88 322)">
    <rect width="212" height="36" rx="18" fill="#F4F4F1"/>
    <text class="sans" x="22" y="23" fill="#060708" font-size="14" font-weight="600">Salvador, BA, Brasil</text>
    <circle cx="190" cy="18" r="4" fill="#3DDC84">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <rect x="224" width="210" height="36" rx="18" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text class="mono" x="244" y="23" fill="#D6D6DA" font-size="13">Node.js · Python · IA</text>
  </g>

  <!-- system map -->
  <g transform="translate(724 86)">
    <path class="link" d="M118 110H190"/>
    <path class="link" d="M302 110C334 110 334 50 366 50"/>
    <path class="link" d="M302 110C334 110 334 170 366 170"/>
    <path class="link" d="M246 134V230"/>
    <path class="link" d="M302 254C334 254 334 274 366 274"/>

    <path class="flow" pathLength="1" d="M118 110H190"/>
    <path class="flow" pathLength="1" d="M302 110C334 110 334 50 366 50" style="animation-delay:.55s"/>
    <path class="flow" pathLength="1" d="M302 110C334 110 334 170 366 170" style="animation-delay:1.1s"/>
    <path class="flow" pathLength="1" d="M246 134V230" style="animation-delay:1.65s"/>
    <path class="flow" pathLength="1" d="M302 254C334 254 334 274 366 274" style="animation-delay:2.2s"/>

    <g class="node" transform="translate(6 86)"><rect width="112" height="48" rx="12"/><circle class="dot" cx="24" cy="24" r="4"/><text x="38" y="29">web</text></g>
    <g class="node" transform="translate(190 86)"><rect width="112" height="48" rx="12"/><circle class="dot" cx="24" cy="24" r="4" style="animation-delay:.3s"/><text x="38" y="29">api</text></g>
    <g class="node" transform="translate(366 26)"><rect width="112" height="48" rx="12"/><circle class="dot" cx="20" cy="24" r="4" style="animation-delay:.9s"/><text x="32" y="29">postgres</text></g>
    <g class="node" transform="translate(366 146)"><rect width="112" height="48" rx="12"/><circle class="dot" cx="24" cy="24" r="4" style="animation-delay:1.4s"/><text x="38" y="29">redis</text></g>
    <g class="node" transform="translate(190 230)"><rect width="112" height="48" rx="12"/><circle class="dot" cx="24" cy="24" r="4" style="animation-delay:1.9s"/><text x="38" y="29">agente</text></g>
    <g class="node" transform="translate(366 250)"><rect width="112" height="48" rx="12"/><circle class="dot" cx="24" cy="24" r="4" style="animation-delay:2.4s"/><text x="38" y="29">llm</text></g>
  </g>

  <text class="mono" x="88" y="432" fill="#6B6B72" font-size="12">backend · ia aplicada · produto · operação</text>
  <text class="mono" x="1192" y="432" fill="#6B6B72" font-size="12" text-anchor="end">ctrl+k no site para buscar tudo</text>
</svg>
