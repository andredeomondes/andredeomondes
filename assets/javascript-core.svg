  <title id="title">JavaScript Core — 27 de 27 unidades publicadas</title>
  <desc id="desc">Grade com as 27 unidades da série JavaScript Core, todas publicadas, com uma onda de luz de sódio percorrendo as células.</desc>
  <defs>
